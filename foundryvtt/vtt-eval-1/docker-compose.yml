services:
  foundry:
    image: felddy/foundryvtt:14
    hostname: vtt-eval-1
    volumes:
      - type: bind
        source: ./data
        target: /data
    environment:
      - TIMEZONE=America/Chicago
      - FOUNDRY_UID=1000
      - FOUNDRY_PASSWORD=${FOUNDRY_PASSWORD}
      - FOUNDRY_USERNAME=${FOUNDRY_USERNAME}
      - FOUNDRY_ADMIN_KEY=${FOUNDRY_ADMIN_KEY}
      - FOUNDRY_PROXY_PORT=443
      - FOUNDRY_PROXY_SSL=true
    # ports:
    #   - target: 30000
    #     published: 30000
    #     protocol: tcp
    networks:
      - frontend
    restart: unless-stopped
    labels:
      glance.name: Foundry VTT 14
      glance.icon: si:foundryvirtualtabletop
      glance.id: vtt14-prod-1
      glance.url: https://vtt14.home.bowenarrows.net
      glance.description: Foundry Virtual Tabletop v14
      traefik.enable: true
      traefik.http.routers.vtt14-prod-1-http.entrypoints: web
      traefik.http.routers.vtt14-prod-1-http.rule: Host(`vtt14.home.bowenarrows.net`) || Host(`vtt14.bowenarrows.net`)
      traefik.http.routers.vtt14-prod-1-https.entrypoints: websecure
      traefik.http.routers.vtt14-prod-1-https.rule: Host(`vtt14.home.bowenarrows.net`) || Host(`vtt14.bowenarrows.net`)
      traefik.http.routers.vtt14-prod-1-https.tls: true
      traefik.http.routers.vtt14-prod-1-https.tls.certresolver: cloudflare
      traefik.http.routers.vtt14-prod-1-https.service: vtt14-prod-1-svc
      traefik.http.services.vtt14-prod-1-svc.loadBalancer.server.port: 30000

networks:
  frontend:
    external: true